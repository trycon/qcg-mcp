[project]
name = "scanova-mcp"
version = "0.1.0"
description = "Scanova MCP server: QR codes, design, folders, forms, leads, analytics and users over MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pillow>=12.3.0",
    "requests>=2.33.0",
    "uvicorn[standard]>=0.32.1",
    "zxing-cpp>=3.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
