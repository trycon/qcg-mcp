# Local run of the production image: docker compose up --build
services:
  mcpserver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: local
    container_name: mcpserver
    ports:
      - "8000:8000"
    # The image's own HEALTHCHECK (fails unless /health answers 200) applies.
    restart: unless-stopped
