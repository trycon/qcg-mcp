# Semantic versioning from PR titles (Conventional Commits), as in our other repos.
# Merging a PR adds it to the draft release; publishing the draft deploys it
# (.github/workflows/deploy.yml). Nothing deploys on a plain merge to main.
#
#   feat: / enhancement:   → minor  (1.2.0 → 1.3.0)
#   fix: / perf: / others  → patch  (1.2.0 → 1.2.1)
#   type!: or BREAKING CHANGE in the body, or the "breaking" label → major (1.2.0 → 2.0.0)
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - type: "pre-exclude"
    when:
      label: "skip-changelog"
  - title: '💥 Breaking changes'
    semver-increment: "major"
    when:
      label: "breaking"
  - title: '🚀 Features'
    semver-increment: "minor"
    when:
      label: "enhancement"
  - title: '🐛 Fixes'
    when:
      label: "bug"
  - title: '📚 Documentation'
    when:
      label: "documentation"
  - title: '🧰 Maintenance'
    when:
      labels:
        - "chore"
        - "dependencies"
  - type: "version-resolver"
    semver-increment: "patch"

change-template: '- $TITLE (#$NUMBER) $AUTHORS'
change-title-escapes: '\<*_&'
no-changes-template: '- No changes'

autolabeler:
  - label: 'breaking'
    title:
      - '/^\w+(\(.+\))?!:/i'
    body:
      - '/BREAKING CHANGE/'
  - label: 'enhancement'
    title:
      - '/^(feat|enhancement)(\(.+\))?!?:/i'
  - label: 'bug'
    title:
      - '/^(fix|hotfix|perf)(\(.+\))?!?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\(.+\))?!?:/i'
  - label: 'chore'
    title:
      - '/^(chore|refactor|test|ci|build|style|revert)(\(.+\))?!?:/i'

template: |
  ## What's changed

  $CHANGES

  **Contributors:** $CONTRIBUTORS

  Publishing this release deploys it to production (mcp.scanova.io).
