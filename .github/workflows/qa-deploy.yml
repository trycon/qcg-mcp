name: Deploy to QA

# QA (mcp.qa.scanova.io) follows main: every merge deploys it, so a change is tried against QA before it's
# released to production (deploy.yml, release tags only). It runs on the QA EC2 box (Name=qcg-qa) beside QA's
# backend, pointed at QA's Management API by deploy/qa/qa.env. See README → QA.
#
# The image is built here for the box's arm64 and shipped in the CodeDeploy bundle; the box only loads and starts
# it (deploy/qa/scripts), and rolls back to the previous image unless /health answers.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: true

permissions:
  contents: read
  # GitHub OIDC → AWS role qcg-mcp-qa-deploy: no stored AWS keys. It trusts only this repo's `qa` environment and
  # can only upload this app's bundles and deploy the QCG_QA_Mcp group.
  id-token: write

env:
  AWS_REGION: ap-south-1
  APPLICATION_NAME: QCG_QA_GeneratorApp
  DEPLOYMENT_GROUP_NAME: QCG_QA_Mcp
  S3_BUCKET: qcg7-codedeploy-staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build the arm64 image
        run: |
          SHA="${GITHUB_SHA::7}"
          docker buildx build --platform linux/arm64 --build-arg APP_VERSION="qa-${SHA}" -t "qcg-mcp:${SHA}" --load .
          echo "SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Assemble the CodeDeploy bundle
        run: |
          set -euo pipefail
          mkdir bundle
          docker save "qcg-mcp:${SHA}" | gzip > bundle/image.tar.gz
          cp deploy/qa/appspec.yml deploy/qa/docker-compose-qa.yml deploy/qa/qa.env bundle/
          cp -r deploy/qa/scripts bundle/scripts
          echo "${SHA}" > bundle/COMMIT_SHA
          (cd bundle && zip -qr ../bundle.zip .)
          echo "bundle: $(du -h bundle.zip | cut -f1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_QA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload, deploy and wait
        run: |
          set -euo pipefail
          KEY="${APPLICATION_NAME}/qcg-mcp-${GITHUB_SHA}.zip"
          aws s3 cp --only-show-errors bundle.zip "s3://${S3_BUCKET}/${KEY}"
          ID=$(aws deploy create-deployment \
            --application-name "$APPLICATION_NAME" \
            --deployment-group-name "$DEPLOYMENT_GROUP_NAME" \
            --description "qcg-mcp ${SHA} via GitHub Actions" \
            --s3-location "bucket=${S3_BUCKET},key=${KEY},bundleType=zip" \
            --query deploymentId --output text)
          echo "deployment: $ID"
          if ! aws deploy wait deployment-successful --deployment-id "$ID"; then
            echo "::error::deployment $ID did not succeed (the box rolls back to the previous image)"
            aws deploy get-deployment --deployment-id "$ID" --query 'deploymentInfo.{status:status,err:errorInformation}' --output json || true
            exit 1
          fi

      - name: Check it answers through the load balancer
        run: |
          for i in $(seq 1 12); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://mcp.qa.scanova.io/health)" = "200" ] && { echo "mcp.qa.scanova.io is up"; exit 0; }
            sleep 5
          done
          echo "::error::https://mcp.qa.scanova.io/health didn't answer 200"
          exit 1
