name: Release Drafter

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # On a PR: label it from its title (config autolabeler) — that label decides
  # the version bump and the release-notes section.
  label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7

  # On a merge to main: add the PR to the draft release and recompute the next
  # version. Never publishes — publishing deploys.
  update_release_draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
