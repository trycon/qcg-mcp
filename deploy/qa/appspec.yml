# CodeDeploy spec for the QA MCP server (mcp.qa.scanova.io) on the QA EC2 box (Name=qcg-qa).
# Deployed by .github/workflows/qa-deploy.yml (QCG_QA_GeneratorApp / QCG_QA_Mcp). The bundle carries the image,
# built for arm64 on the runner; the hooks load it and swap the container over, and roll back if it isn't healthy.
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/qcg-mcp/release

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 180
      runas: root
